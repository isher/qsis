        :root {
            --brand: #6247bd;
            --brand-light: rgba(98, 71, 189, 0.12);
            --brand-border: rgba(98, 71, 189, 0.28);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #212529;
            line-height: 1.8;
            background-color: #ffffff;
            background-image:
                radial-gradient(circle at 10% 10%, var(--brand-light), transparent 30%),
                radial-gradient(circle at 90% 5%, var(--brand-light), transparent 30%);
            background-attachment: fixed;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 70px 24px;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 55px;
            border-bottom: 1px solid #eee;
            padding-bottom: 35px;
        }
        .header-logo {
            width: 340px;
            padding: 0 0 20px 0;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(135deg,#5438a9 0%,#6247bd 50%,#7559d0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header .en-tag {
            font-size: 18px;
            color: #758499;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .header p {
            color: #555;
            margin-top: 12px;
            font-size: 17px;
        }
        .error-box{
            background: #ffffff;
            padding: 50px 35px;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);
            border:1px solid #eee;
            text-align:center;
            flex-grow:1;
        }
        .error-code{
            font-size: 100px;
            font-weight:800;
            background: linear-gradient(135deg,#5438a9 0%,#6247bd 50%,#7559d0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height:1;
            margin-bottom:24px;
        }
        .error-box h2{
            font-size:26px;
            color:#222;
            margin-bottom:16px;
        }
        .error-box p{
            font-size:17px;
            color:#555;
            margin-bottom:32px;
        }
        .btn-home{
            display:inline-block;
            padding:12px 32px;
            background-color:var(--brand);
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-size:17px;
            transition: all 0.28s ease;
        }
        .btn-home:hover{
            opacity:0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--brand-light);
        }
        .footer {
            margin-top: 70px;
            text-align: center;
            font-size: 14px;
            color: #888;
            padding-top: 26px;
            border-top: 1px solid #eee;
        }
        .footer-item {
            margin: 7px 0;
        }
        .footer a {
            color: #666;
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--brand);
        }
        .privacy-wrap{
            max-width:900px;
            margin:16px auto 0;
        }
        .privacy-wrap summary{
            cursor:pointer;
            color: var(--brand);
            font-size:14px;
            list-style:none;
        }
        .privacy-wrap summary::-webkit-details-marker {
            display: none;
        }
        .privacy-wrap .privacy-body{
            margin-top:14px;
            padding:20px 24px;
            background:#fff;
            border:1px solid #eee;
            border-radius:12px;
            text-align:left;
            font-size:14px;
            color:#444;
            line-height:1.8;
        }
        .privacy-wrap .privacy-body h4{
            text-align:center;
            margin-bottom:12px;
            color:#222;
            font-size:18px;
        }
        .lang-switch{
            text-align:center;
            margin-bottom:16px;
        }
        .lang-switch button{
            border:1px solid var(--brand);
            background:#fff;
            color:var(--brand);
            padding:4px 12px;
            border-radius:6px;
            cursor:pointer;
            margin:0 6px;
        }
        .lang-switch button.active{
            background:var(--brand);
            color:#fff;
        }
        .en-text{
            display:none;
        }
        .cht-text{
            display:none;
        }
        .jp-text{
            display:none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 18px;
            }
            .header h1 {
                font-size: 32px;
                letter-spacing: 2px;
            }
            .error-box{
                padding:30px 20px;
            }
            .error-code{
                font-size:72px;
            }
        }
    </style>
</head>
